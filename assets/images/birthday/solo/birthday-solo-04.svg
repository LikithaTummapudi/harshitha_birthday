<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FC" />
      <stop offset="100%" stop-color="#DCEBFA" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#34557F" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" rx="12" />
  <rect x="12" y="12" width="376" height="296" fill="none" stroke="#A8C9F0" stroke-width="2" stroke-dasharray="6 4" rx="8" />
  
  <!-- Subtle decorative doodles -->
  <circle cx="45" cy="45" r="4" fill="#6D96CC" opacity="0.4" />
  <circle cx="355" cy="45" r="4" fill="#6D96CC" opacity="0.4" />
  <circle cx="45" cy="275" r="4" fill="#6D96CC" opacity="0.4" />
  <circle cx="355" cy="275" r="4" fill="#6D96CC" opacity="0.4" />
  
  <!-- Icon & Illustration -->
  <g transform="translate(200, 120)">
    <circle cx="0" cy="0" r="42" fill="#FFFFFF" filter="url(#shadow)" />
    <text x="0" y="14" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif">✨</text>
  </g>
  
  <!-- Labels -->
  <text x="200" y="200" font-family="'Caveat', 'Segoe UI', cursive, sans-serif" font-size="22" font-weight="bold" fill="#34557F" text-anchor="middle">Harshitha Solo #4</text>
  <text x="200" y="230" font-family="'Segoe UI', sans-serif" font-size="13" fill="#6D96CC" text-anchor="middle">Slot: birthday-solo-04.jpg</text>
  <text x="200" y="255" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8FAECF" text-anchor="middle" font-style="italic">Drop real photo here to replace</text>
</svg>