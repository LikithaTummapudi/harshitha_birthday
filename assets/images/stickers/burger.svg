<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" width="150" height="140">
  <defs>
    <filter id="burger-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3.5" stdDeviation="3.5" flood-color="#4A3018" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="bun-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2BE77"/>
      <stop offset="60%" stop-color="#E4A351"/>
      <stop offset="100%" stop-color="#CA8430"/>
    </linearGradient>
    <linearGradient id="bun-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4A351"/>
      <stop offset="100%" stop-color="#BF7828"/>
    </linearGradient>
    <linearGradient id="patty-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#734731"/>
      <stop offset="100%" stop-color="#54311F"/>
    </linearGradient>
  </defs>

  <!-- Sticker White Cutout Outline -->
  <g filter="url(#burger-shadow)">
    <!-- Top bun dome -->
    <path d="M 22,66 C 20,30 45,18 75,18 C 105,18 130,30 128,66 Z" fill="#FFFFFF"/>
    <!-- Middle layers base -->
    <rect x="18" y="60" width="114" height="48" rx="8" fill="#FFFFFF"/>
    <!-- Bottom bun base -->
    <rect x="24" y="98" width="102" height="24" rx="10" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Bun -->
  <rect x="28" y="102" width="94" height="18" rx="8" fill="url(#bun-bottom)"/>

  <!-- Juicy Patty -->
  <rect x="22" y="86" width="106" height="18" rx="7" fill="url(#patty-grad)"/>
  <!-- Grill texture marks -->
  <line x1="38" y1="92" x2="48" y2="98" stroke="#3D2113" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="92" x2="72" y2="98" stroke="#3D2113" stroke-width="2" stroke-linecap="round"/>
  <line x1="86" y1="92" x2="96" y2="98" stroke="#3D2113" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="92" x2="114" y2="96" stroke="#3D2113" stroke-width="2" stroke-linecap="round"/>

  <!-- Melted Cheddar Cheese Triangle Corner Dropping Over Patty -->
  <polygon points="32,84 118,84 114,88 88,102 70,88" fill="#FFB703"/>

  <!-- Red Tomato Slices -->
  <rect x="26" y="76" width="46" height="10" rx="4" fill="#E63946"/>
  <circle cx="38" cy="81" r="1.6" fill="#FFF2F2"/>
  <rect x="78" y="76" width="46" height="10" rx="4" fill="#E63946"/>
  <circle cx="90" cy="81" r="1.6" fill="#FFF2F2"/>

  <!-- Crisp Wavy Lettuce -->
  <path d="M 22,72 Q 26,78 32,74 Q 38,70 44,75 Q 50,80 56,73 Q 62,69 68,75 Q 74,80 80,73 Q 86,68 92,75 Q 98,80 104,73 Q 110,69 116,75 Q 122,80 128,72 Z" fill="#6AA84F"/>

  <!-- Top Bun Dome -->
  <path d="M 24,66 C 22,34 46,22 75,22 C 104,22 128,34 126,66 Z" fill="url(#bun-top)"/>

  <!-- Sesame Seeds on Top Bun -->
  <!-- Seed 1 -->
  <ellipse cx="50" cy="38" rx="2.2" ry="4" transform="rotate(-30, 50, 38)" fill="#FFF4D9"/>
  <!-- Seed 2 -->
  <ellipse cx="75" cy="32" rx="2.2" ry="4" transform="rotate(10, 75, 32)" fill="#FFF4D9"/>
  <!-- Seed 3 -->
  <ellipse cx="100" cy="38" rx="2.2" ry="4" transform="rotate(35, 100, 38)" fill="#FFF4D9"/>
  <!-- Seed 4 -->
  <ellipse cx="62" cy="48" rx="2.2" ry="4" transform="rotate(-15, 62, 48)" fill="#FFF4D9"/>
  <!-- Seed 5 -->
  <ellipse cx="88" cy="48" rx="2.2" ry="4" transform="rotate(20, 88, 48)" fill="#FFF4D9"/>
  <!-- Seed 6 -->
  <ellipse cx="38" cy="52" rx="2" ry="3.5" transform="rotate(-40, 38, 52)" fill="#FFF4D9"/>
  <!-- Seed 7 -->
  <ellipse cx="112" cy="52" rx="2" ry="3.5" transform="rotate(40, 112, 52)" fill="#FFF4D9"/>

  <!-- Bun Gloss Highlight -->
  <path d="M 44,32 Q 75,26 106,32" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
