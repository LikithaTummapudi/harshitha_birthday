<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <defs>
    <filter id="glasses-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#34557F" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="frame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C68B59"/>
      <stop offset="40%" stop-color="#8B5A36"/>
      <stop offset="70%" stop-color="#D49B6A"/>
      <stop offset="100%" stop-color="#6F3F1E"/>
    </linearGradient>
  </defs>

  <!-- Sticker White Cutout Outline -->
  <g filter="url(#glasses-shadow)">
    <!-- Left rim base -->
    <circle cx="48" cy="42" r="30" fill="#FFFFFF"/>
    <!-- Right rim base -->
    <circle cx="112" cy="42" r="30" fill="#FFFFFF"/>
    <!-- Bridge base -->
    <rect x="74" y="36" width="12" height="12" rx="4" fill="#FFFFFF"/>
    <!-- Temples base -->
    <rect x="14" y="32" width="16" height="10" rx="4" fill="#FFFFFF"/>
    <rect x="130" y="32" width="16" height="10" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Left Glass Lens & Frame -->
  <circle cx="48" cy="42" r="26" fill="rgba(225, 240, 255, 0.4)" stroke="url(#frame-grad)" stroke-width="4.5"/>
  <!-- Left Lens Glint Reflection -->
  <path d="M 34,26 Q 42,20 54,20" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="58" cy="22" r="1.5" fill="#FFFFFF"/>

  <!-- Right Glass Lens & Frame -->
  <circle cx="112" cy="42" r="26" fill="rgba(225, 240, 255, 0.4)" stroke="url(#frame-grad)" stroke-width="4.5"/>
  <!-- Right Lens Glint Reflection -->
  <path d="M 98,26 Q 106,20 118,20" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="122" cy="22" r="1.5" fill="#FFFFFF"/>

  <!-- Gold Nose Bridge -->
  <path d="M 72,40 Q 80,33 88,40" fill="none" stroke="#E5B358" stroke-width="3" stroke-linecap="round"/>
  <circle cx="74" cy="45" r="2.5" fill="#E5B358"/>
  <circle cx="86" cy="45" r="2.5" fill="#E5B358"/>

  <!-- Left & Right Temple Hinges -->
  <path d="M 22,38 L 14,35" stroke="#E5B358" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 138,38 L 146,35" stroke="#E5B358" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Sparkle Accent -->
  <path d="M 132,18 L 134,22 L 138,24 L 134,26 L 132,30 L 130,26 L 126,24 L 130,22 Z" fill="#FFD166"/>
</svg>
