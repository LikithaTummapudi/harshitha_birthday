<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <defs>
    <filter id="whale-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="4" stdDeviation="3.5" flood-color="#34557F" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="whale-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8DB6E2"/>
      <stop offset="60%" stop-color="#6595C9"/>
      <stop offset="100%" stop-color="#4C7FA9"/>
    </linearGradient>
    <linearGradient id="whale-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF2FC"/>
    </linearGradient>
  </defs>

  <!-- Water Spout Droplets and Floating Heart -->
  <g class="whale-spout-group">
    <path d="M 68,48 Q 66,32 64,22" fill="none" stroke="#A8D0F5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
    <circle cx="63" cy="18" r="3.5" fill="#7CB6EC"/>
    
    <path d="M 66,48 Q 54,36 48,28" fill="none" stroke="#A8D0F5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="46" cy="26" r="2.8" fill="#7CB6EC"/>
    
    <path d="M 70,48 Q 80,36 86,28" fill="none" stroke="#A8D0F5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="88" cy="27" r="2.8" fill="#7CB6EC"/>
    
    <path d="M 64,12 C 64,8 59,6 59,9 C 59,12 64,16 64,16 C 64,16 69,12 69,9 C 69,6 64,8 64,12 Z" fill="#FF85A2" stroke="#FFFFFF" stroke-width="0.8"/>
  </g>

  <!-- Main Whale Body with White Cutout Sticker Border -->
  <path d="M 30,85 C 22,65 50,48 85,50 C 118,52 135,72 132,92 C 130,105 110,118 72,118 C 42,118 28,105 30,85 Z" fill="#FFFFFF" filter="url(#whale-shadow)"/>
  <path d="M 125,88 C 138,82 152,72 154,68 C 154,78 146,90 142,94 C 148,98 156,108 153,114 C 148,110 136,102 125,96 Z" fill="#FFFFFF"/>

  <!-- Whale Main Body -->
  <path d="M 32,85 C 24,67 52,52 85,53 C 116,54 133,74 130,92 C 128,104 108,115 72,115 C 44,115 30,103 32,85 Z" fill="url(#whale-grad)"/>

  <!-- Tail Fluke -->
  <path d="M 124,88 C 136,83 149,74 151,70 C 151,79 143,89 139,93 C 145,97 153,106 150,111 C 145,108 134,101 124,95 Z" fill="#6595C9"/>

  <!-- White Belly -->
  <path d="M 40,94 C 42,104 55,115 74,115 C 98,115 116,107 122,96 C 112,91 92,90 74,90 C 56,90 44,92 40,94 Z" fill="url(#whale-belly)"/>
  
  <!-- Belly texture ridges -->
  <path d="M 54,95 Q 55,108 58,114" fill="none" stroke="#D3E4F8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 68,93 Q 70,108 72,115" fill="none" stroke="#D3E4F8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 82,93 Q 83,107 86,114" fill="none" stroke="#D3E4F8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 96,94 Q 97,105 100,112" fill="none" stroke="#D3E4F8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Flipper Fin -->
  <path d="M 72,94 C 70,104 78,114 88,110 C 93,108 92,98 84,95 Z" fill="#5485B8" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Kawaii Face -->
  <path d="M 48,78 Q 53,73 58,78" fill="none" stroke="#1F3554" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="44" cy="86" rx="5" ry="3.2" fill="#FFA5B9" opacity="0.85"/>
  <path d="M 38,84 Q 42,90 46,85" fill="none" stroke="#1F3554" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sparkles -->
  <path d="M 24,56 L 26,61 L 31,63 L 26,65 L 24,70 L 22,65 L 17,63 L 22,61 Z" fill="#FFD166"/>
  <circle cx="106" cy="62" r="1.8" fill="#FFFFFF"/>
</svg>
