<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <filter id="hearts-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#803D4D" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#hearts-shadow)">
    <!-- Main sweet pink hand-drawn doodle heart -->
    <path d="M 40,24 C 40,14 26,10 24,20 C 22,30 38,48 40,52 C 42,48 58,30 56,20 C 54,10 40,14 40,24 Z" fill="#FFA5B9" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Small baby-blue heart -->
    <path d="M 72,36 C 72,28 62,25 60,32 C 58,40 70,52 72,55 C 74,52 86,40 84,32 C 82,25 72,28 72,36 Z" fill="#A8C9F0" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Sparkles -->
    <circle cx="18" cy="22" r="2.5" fill="#FFA5B9"/>
    <circle cx="82" cy="22" r="2" fill="#FFD166"/>
    <path d="M 32,22 Q 35,16 38,18" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
