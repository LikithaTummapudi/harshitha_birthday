    <path d="M 32,8 L 35,26 L 52,28 L 37,38 L 42,54 L 28,42 L 14,52 L 20,36 L 6,26 L 24,24 Z" fill="#FFD166" stroke="#FFFFFF" stroke-width="2"/>
