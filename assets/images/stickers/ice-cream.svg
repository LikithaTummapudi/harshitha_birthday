<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 160" width="110" height="160">
  <defs>
    <filter id="icecream-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="4" stdDeviation="3.5" flood-color="#5A3A28" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="cone-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2A665"/>
      <stop offset="50%" stop-color="#F2C189"/>
      <stop offset="100%" stop-color="#CF914E"/>
    </linearGradient>
    <linearGradient id="cream-pink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="60%" stop-color="#FDB4C6"/>
      <stop offset="100%" stop-color="#F78EA7"/>
    </linearGradient>
    <linearGradient id="cream-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#BEE0FC"/>
      <stop offset="100%" stop-color="#95C8F8"/>
    </linearGradient>
  </defs>

  <!-- Sticker White Cutout Outline -->
  <g filter="url(#icecream-shadow)">
    <!-- Cherry Stem & Cherry base -->
    <circle cx="55" cy="24" r="14" fill="#FFFFFF"/>
    <path d="M 55,20 Q 64,8 74,6" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- Swirl base -->
    <path d="M 22,86 C 14,75 20,45 42,38 C 50,28 66,28 72,40 C 92,44 96,72 88,86 C 75,94 35,94 22,86 Z" fill="#FFFFFF"/>
    <!-- Cone base -->
    <polygon points="26,88 84,88 55,152" fill="#FFFFFF"/>
  </g>

  <!-- Waffle Cone -->
  <polygon points="28,90 82,90 55,148" fill="url(#cone-grad)"/>
  <!-- Cone Waffle Cross-Hatch Pattern -->
  <g stroke="#B87B37" stroke-width="1.3" opacity="0.75">
    <line x1="37" y1="90" x2="68" y2="132"/>
    <line x1="47" y1="90" x2="74" y2="118"/>
    <line x1="57" y1="90" x2="80" y2="104"/>
    <line x1="73" y1="90" x2="42" y2="132"/>
    <line x1="63" y1="90" x2="36" y2="118"/>
    <line x1="53" y1="90" x2="30" y2="104"/>
  </g>
  <!-- Cone Rim -->
  <path d="M 26,89 Q 55,93 84,89" stroke="#A86A26" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Swirl Base Layer (Soft Blue Cream) -->
  <path d="M 24,88 C 22,76 34,74 44,74 C 54,74 58,70 68,70 C 78,70 88,76 86,88 C 76,94 34,94 24,88 Z" fill="url(#cream-blue)"/>

  <!-- Swirl Mid Layer (Strawberry Pink) -->
  <path d="M 30,72 C 26,60 38,54 50,54 C 62,54 74,52 80,62 C 84,72 74,76 66,74 C 56,72 48,76 38,76 C 32,76 29,74 30,72 Z" fill="url(#cream-pink)"/>

  <!-- Swirl Top Layer (Vanilla Swirl Peak) -->
  <path d="M 38,54 C 36,44 46,38 55,38 C 65,38 72,44 70,52 C 64,56 46,58 38,54 Z" fill="#FFFBF0"/>
  <path d="M 48,40 Q 55,28 58,32 Q 56,38 52,40 Z" fill="#FFFBF0"/>

  <!-- Sprinkles! -->
  <!-- Blue sprinkles -->
  <line x1="38" y1="64" x2="43" y2="67" stroke="#4F92DE" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="78" x2="73" y2="76" stroke="#4F92DE" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gold sprinkles -->
  <line x1="56" y1="60" x2="60" y2="65" stroke="#F5C042" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="80" x2="40" y2="82" stroke="#F5C042" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mint sprinkle -->
  <line x1="68" y1="58" x2="72" y2="62" stroke="#52B788" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Violet sprinkle -->
  <line x1="50" y1="78" x2="55" y2="75" stroke="#B084CC" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cherry on Top -->
  <!-- Curved cherry stem -->
  <path d="M 55,22 Q 65,8 74,6" fill="none" stroke="#688B58" stroke-width="2" stroke-linecap="round"/>
  <!-- Cherry body -->
  <circle cx="55" cy="24" r="11" fill="#D62839"/>
  <circle cx="55" cy="24" r="11" fill="url(#cherry-glow)"/>
  <!-- Highlight glint -->
  <ellipse cx="51.5" cy="20.5" rx="3" ry="1.8" transform="rotate(-30, 51.5, 20.5)" fill="#FFFFFF" opacity="0.9"/>
</svg>
