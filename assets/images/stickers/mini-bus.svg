<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 120" width="170" height="120">
  <defs>
    <filter id="bus-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3.5" stdDeviation="3.5" flood-color="#34557F" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="bus-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8DB6E2"/>
      <stop offset="100%" stop-color="#5586BA"/>
    </linearGradient>
  </defs>

  <!-- Sticker White Cutout Outline -->
  <g filter="url(#bus-shadow)">
    <!-- Roof rack base -->
    <rect x="36" y="16" width="98" height="12" rx="4" fill="#FFFFFF"/>
    <!-- Main bus body base -->
    <rect x="18" y="24" width="134" height="68" rx="20" fill="#FFFFFF"/>
    <!-- Wheels base -->
    <circle cx="50" cy="94" r="18" fill="#FFFFFF"/>
    <circle cx="120" cy="94" r="18" fill="#FFFFFF"/>
    <!-- Front bumper base -->
    <rect x="12" y="74" width="16" height="14" rx="4" fill="#FFFFFF"/>
    <rect x="142" y="74" width="16" height="14" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Roof Rack & Suitcases -->
  <rect x="40" y="20" width="90" height="4" rx="2" fill="#8898AA"/>
  <line x1="50" y1="20" x2="50" y2="24" stroke="#8898AA" stroke-width="2"/>
  <line x1="85" y1="20" x2="85" y2="24" stroke="#8898AA" stroke-width="2"/>
  <line x1="120" y1="20" x2="120" y2="24" stroke="#8898AA" stroke-width="2"/>
  <!-- Cute Pastel Suitcase on Roof -->
  <rect x="56" y="12" width="28" height="9" rx="2" fill="#F8C0C8" stroke="#D88694" stroke-width="1"/>
  <rect x="90" y="10" width="24" height="11" rx="2" fill="#FFE5A3" stroke="#D4A747" stroke-width="1"/>

  <!-- Bus Upper Half (Cream/Off-White) -->
  <path d="M 22,54 L 22,44 C 22,32 32,26 44,26 L 126,26 C 138,26 148,32 148,44 L 148,54 Z" fill="#FBF8F2"/>

  <!-- Bus Lower Half (Cornflower Denim Blue) -->
  <path d="M 22,54 L 148,54 L 148,78 C 148,84 142,88 136,88 L 34,88 C 28,88 22,84 22,78 Z" fill="url(#bus-blue)"/>

  <!-- Horizontal Chrome Beltline Stripe -->
  <line x1="22" y1="54" x2="148" y2="54" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Windows (Pastel Sky Glass with reflections) -->
  <!-- Front windshield -->
  <path d="M 28,32 L 48,32 L 48,50 L 26,50 C 25,42 26,36 28,32 Z" fill="#D3E7FA" stroke="#9BBFE5" stroke-width="1.2"/>
  <line x1="32" y1="36" x2="42" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Middle window 1 -->
  <rect x="53" y="32" width="24" height="18" rx="3" fill="#D3E7FA" stroke="#9BBFE5" stroke-width="1.2"/>
  <line x1="58" y1="36" x2="68" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Middle window 2 -->
  <rect x="82" y="32" width="24" height="18" rx="3" fill="#D3E7FA" stroke="#9BBFE5" stroke-width="1.2"/>
  <!-- Rear window -->
  <path d="M 111,32 L 138,32 C 142,36 144,42 144,50 L 111,50 Z" fill="#D3E7FA" stroke="#9BBFE5" stroke-width="1.2"/>

  <!-- Front Chrome Headlight -->
  <circle cx="28" cy="68" r="6" fill="#FFF275" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Rear Taillight -->
  <rect x="144" y="64" width="4" height="8" rx="2" fill="#E63946"/>

  <!-- Cute Peace/Friendship Flower on Front Door -->
  <circle cx="85" cy="70" r="3" fill="#FFF275"/>
  <ellipse cx="85" cy="65" rx="1.5" ry="2.5" fill="#FFFFFF"/>
  <ellipse cx="85" cy="75" rx="1.5" ry="2.5" fill="#FFFFFF"/>
  <ellipse cx="80" cy="70" rx="2.5" ry="1.5" fill="#FFFFFF"/>
  <ellipse cx="90" cy="70" rx="2.5" ry="1.5" fill="#FFFFFF"/>

  <!-- Front & Rear Chrome Bumpers -->
  <rect x="14" y="78" width="10" height="7" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <rect x="146" y="78" width="10" height="7" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>

  <!-- Wheels (Tires & Hubcaps) -->
  <!-- Left Wheel -->
  <circle cx="50" cy="94" r="14" fill="#334155"/>
  <circle cx="50" cy="94" r="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="50" cy="94" r="3" fill="#334155"/>

  <!-- Right Wheel -->
  <circle cx="120" cy="94" r="14" fill="#334155"/>
  <circle cx="120" cy="94" r="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="120" cy="94" r="3" fill="#334155"/>
</svg>
