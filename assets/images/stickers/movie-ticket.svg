<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100">
  <defs>
    <filter id="ticket-shadow" x="-5%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Ticket Body with side notch cutouts -->
  <path d="M 10,8 
           L 160,8 
           A 12,12 0 0,0 160,32 
           L 160,68 
           A 12,12 0 0,0 160,92 
           L 10,92 
           A 12,12 0 0,0 10,68 
           L 10,32 
           A 12,12 0 0,0 10,8 Z" 
        fill="#F4D06F" stroke="#E0B647" stroke-width="2" filter="url(#ticket-shadow)"/>
  
  <!-- Stub Perforation Line -->
  <line x1="160" y1="8" x2="160" y2="92" stroke="#B88A22" stroke-width="1.8" stroke-dasharray="4,4" opacity="0.8"/>

  <!-- Inner Decorative Border -->
  <rect x="18" y="14" width="134" height="72" rx="4" fill="none" stroke="#B88A22" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- Main Section Text -->
  <text x="85" y="32" font-family="'Patrick Hand', 'Caveat', cursive, sans-serif" font-size="14" font-weight="800" fill="#2E4057" text-anchor="middle" letter-spacing="2">★ CINEMA NIGHT ★</text>
  <text x="85" y="52" font-family="monospace, sans-serif" font-size="18" font-weight="900" fill="#D81159" text-anchor="middle" letter-spacing="3">ADMIT ONE</text>
  <text x="85" y="70" font-family="'Patrick Hand', 'Caveat', cursive, sans-serif" font-size="12" font-weight="700" fill="#3D5A80" text-anchor="middle">HARSHITHA &amp; BESTIE ♡</text>
  <text x="85" y="82" font-family="monospace, sans-serif" font-size="8" fill="#8D99AE" text-anchor="middle">ROW: VIP • SEAT: 2510</text>

  <!-- Stub Section Text & Mini Barcode -->
  <text x="185" y="28" font-family="monospace, sans-serif" font-size="9" font-weight="800" fill="#2E4057" text-anchor="middle">STUB</text>
  <text x="185" y="42" font-family="monospace, sans-serif" font-size="10" font-weight="900" fill="#D81159" text-anchor="middle">2510</text>
  
  <!-- Barcode Lines -->
  <g fill="#2E4057">
    <rect x="168" y="52" width="2" height="28"/>
    <rect x="172" y="52" width="4" height="28"/>
    <rect x="178" y="52" width="1.5" height="28"/>
    <rect x="182" y="52" width="3" height="28"/>
    <rect x="187" y="52" width="1" height="28"/>
    <rect x="190" y="52" width="4" height="28"/>
    <rect x="196" y="52" width="2" height="28"/>
    <rect x="200" y="52" width="3" height="28"/>
  </g>
</svg>
