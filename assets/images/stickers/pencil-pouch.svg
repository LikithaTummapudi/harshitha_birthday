<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 120" width="170" height="120">
  <defs>
    <filter id="pouch-shadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="pouch-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90C2E7"/>
      <stop offset="100%" stop-color="#6B9AC4"/>
    </linearGradient>
  </defs>

  <!-- Pens / Pencils sticking out from top (all inside viewBox) -->
  <!-- Yellow Highlighter -->
  <g transform="translate(48, 14) rotate(-10)">
    <rect x="0" y="8" width="12" height="36" rx="3" fill="#FFE066" stroke="#E6BE2E" stroke-width="1.2"/>
    <rect x="2" y="0" width="8" height="9" rx="2" fill="#E6BE2E"/>
  </g>

  <!-- Pink Gel Pen -->
  <g transform="translate(76, 12) rotate(4)">
    <rect x="0" y="8" width="8" height="38" rx="2" fill="#FF85A2" stroke="#E05780" stroke-width="1.2"/>
    <polygon points="1,8 7,8 4,1" fill="#4A4A4A"/>
  </g>

  <!-- Mint Pencil with Eraser -->
  <g transform="translate(98, 16) rotate(14)">
    <rect x="0" y="8" width="9" height="35" rx="1.5" fill="#9BF6FF" stroke="#5AC4CC" stroke-width="1.2"/>
    <rect x="0" y="1" width="9" height="8" rx="1.5" fill="#FFC6FF"/>
  </g>

  <!-- Main Pouch Canvas Body -->
  <path d="M 20,50 
           C 20,44 28,42 36,42 
           L 134,42 
           C 144,42 150,46 152,54 
           L 156,92 
           C 158,100 150,106 142,106 
           L 26,106 
           C 18,106 14,100 16,92 Z" 
        fill="url(#pouch-body)" stroke="#466995" stroke-width="2" filter="url(#pouch-shadow)"/>

  <!-- Contrast Bottom Panel -->
  <path d="M 18,86 L 154,86 L 156,92 C 158,100 150,106 142,106 L 26,106 C 18,106 14,100 16,92 Z" fill="#F4D06F" opacity="0.85"/>

  <!-- Decorative Stitches -->
  <line x1="24" y1="48" x2="148" y2="48" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="20" y1="84" x2="152" y2="84" stroke="#466995" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Zipper Track -->
  <rect x="22" y="40" width="128" height="5" rx="2" fill="#D3D3D3" stroke="#888888" stroke-width="1"/>
  
  <!-- Zipper Pull Tag with Heart Charm -->
  <rect x="24" y="42" width="10" height="7" rx="2" fill="#E6BE2E" stroke="#B88A22" stroke-width="1"/>
  <path d="M 29,49 L 29,60 M 25,60 C 25,56 33,56 33,60 C 33,64 29,68 29,68 C 29,68 25,64 25,60 Z" fill="#FF5E7E" stroke="#B88A22" stroke-width="1"/>

  <!-- Cute Patch on Front -->
  <rect x="62" y="58" width="46" height="20" rx="4" fill="#FFFFFF" opacity="0.9" stroke="#6B9AC4" stroke-width="1"/>
  <text x="85" y="72" font-family="'Patrick Hand', 'Caveat', cursive, sans-serif" font-size="11" font-weight="700" fill="#466995" text-anchor="middle">bestie pouch ♡</text>
</svg>
