<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 140" width="150" height="140">
  <defs>
    <filter id="pizza-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3.5" stdDeviation="3.5" flood-color="#5A3A1C" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="crust-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAA655"/>
      <stop offset="100%" stop-color="#C67D28"/>
    </linearGradient>
    <linearGradient id="cheese-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5"/>
      <stop offset="40%" stop-color="#FFD152"/>
      <stop offset="100%" stop-color="#FFA826"/>
    </linearGradient>
  </defs>

  <!-- Sticker White Cutout Outline -->
  <g filter="url(#pizza-shadow)">
    <!-- Base triangle with rounded crust top -->
    <path d="M 18,34 Q 75,10 132,34 L 80,132 Q 75,138 70,132 Z" fill="#FFFFFF"/>
    <!-- Crust puff bumps border -->
    <ellipse cx="32" cy="30" rx="18" ry="12" fill="#FFFFFF"/>
    <ellipse cx="75" cy="22" rx="22" ry="14" fill="#FFFFFF"/>
    <ellipse cx="118" cy="30" rx="18" ry="12" fill="#FFFFFF"/>
  </g>

  <!-- Crust Bumps (Puffy Golden Edge) -->
  <ellipse cx="32" cy="30" rx="15" ry="10" fill="url(#crust-grad)"/>
  <ellipse cx="75" cy="22" rx="19" ry="12" fill="url(#crust-grad)"/>
  <ellipse cx="118" cy="30" rx="15" ry="10" fill="url(#crust-grad)"/>

  <!-- Tomato Sauce Base Rim -->
  <path d="M 22,38 Q 75,20 128,38 L 75,130 Z" fill="#D3322B"/>

  <!-- Melted Golden Cheese Layer with Gooey Drips -->
  <path d="M 24,42 Q 75,25 126,42 L 78,126 Q 75,131 72,126 Z" fill="url(#cheese-grad)"/>

  <!-- Gooey Melted Cheese Drips at Crust Edge -->
  <path d="M 36,44 Q 38,54 44,52 Q 48,46 50,44" fill="#FFE066"/>
  <path d="M 68,40 Q 72,56 78,54 Q 82,44 86,40" fill="#FFE066"/>
  <path d="M 104,44 Q 106,52 112,50 Q 116,46 118,44" fill="#FFE066"/>

  <!-- Pepperoni Slices -->
  <!-- Pepperoni 1 -->
  <circle cx="56" cy="62" r="13" fill="#B72224"/>
  <circle cx="56" cy="62" r="11" fill="#D13B39"/>
  <circle cx="52" cy="59" r="1.8" fill="#8E1416"/>
  <circle cx="59" cy="64" r="1.5" fill="#8E1416"/>
  <circle cx="58" cy="58" r="1.2" fill="#F4958A"/>

  <!-- Pepperoni 2 -->
  <circle cx="94" cy="66" r="12" fill="#B72224"/>
  <circle cx="94" cy="66" r="10.2" fill="#D13B39"/>
  <circle cx="91" cy="63" r="1.6" fill="#8E1416"/>
  <circle cx="97" cy="68" r="1.4" fill="#8E1416"/>
  <circle cx="95" cy="62" r="1.2" fill="#F4958A"/>

  <!-- Pepperoni 3 (Half tucked on left) -->
  <circle cx="44" cy="94" r="11" fill="#B72224"/>
  <circle cx="44" cy="94" r="9.2" fill="#D13B39"/>
  <circle cx="42" cy="91" r="1.4" fill="#8E1416"/>
  <circle cx="46" cy="96" r="1.2" fill="#8E1416"/>

  <!-- Pepperoni 4 (Lower center) -->
  <circle cx="78" cy="98" r="10" fill="#B72224"/>
  <circle cx="78" cy="98" r="8.2" fill="#D13B39"/>
  <circle cx="76" cy="96" r="1.2" fill="#8E1416"/>

  <!-- Fresh Green Basil Leaves -->
  <path d="M 72,68 C 65,65 62,56 68,54 C 74,56 76,64 72,68 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="0.8"/>
  <path d="M 98,92 C 92,90 90,82 96,80 C 101,82 102,90 98,92 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="0.8"/>
  <path d="M 60,110 C 56,108 55,102 59,100 C 63,101 64,107 60,110 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="0.8"/>

  <!-- Golden toasted spots on cheese -->
  <ellipse cx="64" cy="82" rx="3.5" ry="2.2" fill="#E08B20" opacity="0.6"/>
  <ellipse cx="88" cy="112" rx="2.5" ry="1.6" fill="#E08B20" opacity="0.6"/>
</svg>
