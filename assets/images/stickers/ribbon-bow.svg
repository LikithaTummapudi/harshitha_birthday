<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <defs>
    <filter id="bow-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#34557F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Tails -->
  <path d="M 60,50 Q 40,80 20,95 Q 40,75 50,55 Z" fill="#6D96CC" filter="url(#bow-shadow)" />
  <path d="M 60,50 Q 80,80 100,95 Q 80,75 70,55 Z" fill="#6D96CC" filter="url(#bow-shadow)" />
  <!-- Left Loop -->
  <path d="M 60,45 C 40,15 5,20 15,45 C 20,60 50,50 60,45 Z" fill="#A8C9F0" stroke="#6D96CC" stroke-width="2" filter="url(#bow-shadow)" />
  <!-- Right Loop -->
  <path d="M 60,45 C 80,15 115,20 105,45 C 100,60 70,50 60,45 Z" fill="#A8C9F0" stroke="#6D96CC" stroke-width="2" filter="url(#bow-shadow)" />
  <!-- Center Knot -->
  <circle cx="60" cy="45" r="9" fill="#5A83B8" stroke="#34557F" stroke-width="1.5" />
</svg>