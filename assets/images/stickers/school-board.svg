<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 130">
  <defs>
    <filter id="board-shadow" x="-8%" y="-8%" width="125%" height="125%">
      <feDropShadow dx="3" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="wood-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5C3A1E"/>
    </linearGradient>
    <linearGradient id="chalkboard-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D4A3E"/>
      <stop offset="100%" stop-color="#1E352B"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Wooden Frame -->
  <rect x="6" y="6" width="168" height="114" rx="6" fill="url(#wood-frame)" stroke="#4A2E18" stroke-width="2" filter="url(#board-shadow)"/>
  
  <!-- Inner Green Slate Surface -->
  <rect x="15" y="15" width="150" height="92" rx="3" fill="url(#chalkboard-bg)"/>
  
  <!-- Chalk Dust Texture Overlay -->
  <path d="M 20,25 Q 70,35 120,22 Q 150,40 160,30" stroke="#FFFFFF" stroke-width="12" fill="none" opacity="0.06"/>
  <path d="M 30,85 Q 80,70 145,80" stroke="#FFFFFF" stroke-width="14" fill="none" opacity="0.05"/>

  <!-- Chalk Writing -->
  <text x="90" y="42" font-family="'Patrick Hand', 'Caveat', cursive, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.95">Hachiga + Bulugu</text>
  <text x="90" y="62" font-family="'Patrick Hand', 'Caveat', cursive, sans-serif" font-size="16" font-weight="800" fill="#FFE066" text-anchor="middle" opacity="0.95">= CHAOS ♡</text>
  <text x="90" y="80" font-family="'Patrick Hand', 'Caveat', cursive, sans-serif" font-size="10" fill="#A8DADC" text-anchor="middle" opacity="0.85">maths is illegal 🚫</text>
  <text x="90" y="96" font-family="monospace, sans-serif" font-size="8" fill="#F1FAEE" text-anchor="middle" opacity="0.7">1 + 1 = BESTIES FOREVER</text>

  <!-- Wooden Chalk Ledge at Bottom -->
  <rect x="12" y="104" width="156" height="6" rx="2" fill="#A06835" stroke="#5C3A1E" stroke-width="1"/>
  
  <!-- Chalk Sticks & Eraser on Ledge -->
  <!-- White chalk stick -->
  <rect x="25" y="102" width="14" height="4" rx="1.5" fill="#FFFFFF" opacity="0.9"/>
  <!-- Yellow chalk stick -->
  <rect x="42" y="102" width="12" height="4" rx="1.5" fill="#FFE066" opacity="0.9"/>
  <!-- Blue chalk stick -->
  <rect x="57" y="102" width="10" height="4" rx="1.5" fill="#A8DADC" opacity="0.9"/>
  <!-- Mini chalkboard eraser -->
  <rect x="125" y="99" width="22" height="8" rx="2" fill="#4A3728"/>
  <rect x="125" y="104" width="22" height="3" fill="#D4A373"/>
</svg>
