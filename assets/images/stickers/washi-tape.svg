<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40">
  <defs>
    <pattern id="stripes" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6D96CC" stroke-width="3" opacity="0.3" />
    </pattern>
  </defs>
  <!-- jagged torn edges -->
  <path d="M 0,0 L 160,0 L 157,8 L 160,16 L 156,24 L 160,32 L 158,40 L 0,40 L 3,32 L 0,24 L 4,16 L 0,8 Z" fill="#A8C9F0" opacity="0.75" />
