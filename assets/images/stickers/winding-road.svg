<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 130" width="170" height="130">
  <defs>
    <filter id="road-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3.5" stdDeviation="3.5" flood-color="#34557F" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="kraft-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#EFE8DB"/>
    </linearGradient>
  </defs>

  <!-- Sticker White Cutout Outline -->
  <g filter="url(#road-shadow)">
    <polygon points="12,18 42,12 85,16 128,10 156,22 158,62 152,108 126,118 84,114 42,122 14,106 10,64" fill="#FFFFFF"/>
  </g>

  <!-- Torn Kraft Paper Scrap Body -->
  <polygon points="15,21 43,15 85,19 126,13 153,25 155,62 149,105 125,115 84,111 43,119 17,103 13,64" fill="url(#kraft-paper)" stroke="#DDD5C7" stroke-width="1"/>

  <!-- Subtle Paper Stamp / Grid lines -->
  <line x1="25" y1="25" x2="25" y2="105" stroke="#E2DCD1" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="55" y1="25" x2="55" y2="105" stroke="#E2DCD1" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="85" y1="25" x2="85" y2="105" stroke="#E2DCD1" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="115" y1="25" x2="115" y2="105" stroke="#E2DCD1" stroke-width="0.8" stroke-dasharray="3 3"/>
  <line x1="145" y1="25" x2="145" y2="105" stroke="#E2DCD1" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Grassy Road Margins -->
  <path d="M 22,100 C 45,95 60,65 85,62 C 110,60 120,40 145,30" fill="none" stroke="#A7C957" stroke-width="36" stroke-linecap="round"/>

  <!-- Asphalt Winding Road -->
  <path d="M 22,100 C 45,95 60,65 85,62 C 110,60 120,40 145,30" fill="none" stroke="#495057" stroke-width="26" stroke-linecap="round"/>

  <!-- Road White Side Edges -->
  <path d="M 23,88 C 45,83 60,53 85,50 C 110,48 120,28 145,18" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>
  <path d="M 21,112 C 45,107 60,77 85,74 C 110,72 120,52 145,42" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>

  <!-- Dashed Yellow Centerline -->
  <path d="M 22,100 C 45,95 60,65 85,62 C 110,60 120,40 145,30" fill="none" stroke="#FFD166" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>

  <!-- Mini Signpost: "Vijayawada ➔ Forever" -->
  <g transform="translate(108, 62)">
    <rect x="11" y="8" width="4" height="28" rx="2" fill="#8D5B4C"/>
    <rect x="-4" y="0" width="34" height="15" rx="3" fill="#2A9D8F" stroke="#FFFFFF" stroke-width="1"/>
    <text x="13" y="10" font-family="'Patrick Hand', cursive, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NEXT STOP ➔</text>
  </g>

  <!-- Cute Road Trip Pin / Stamp Tag -->
  <g transform="translate(25, 25)">
    <text x="0" y="8" font-family="'Caveat', cursive, sans-serif" font-size="11" font-weight="bold" fill="#3D5A80">Our Journey ~</text>
  </g>

  <!-- Cute Tiny Car / Pin on Road -->
  <circle cx="85" cy="62" r="5" fill="#E63946" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="85" cy="62" r="1.5" fill="#FFFFFF"/>
</svg>
